<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ping - Coming Soon</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="class14.css">
</head>

<body>

    <div class="top-line"></div>

    <main class="container">

        <!-- Logo -->
        <div class="logo">
            PING<span>.</span>
        </div>

        <!-- Heading -->
        <h1>
            We are launching <strong>soon!</strong>
        </h1>

        <p class="subtitle">
            Subscribe and get notified
        </p>

        <!-- Email Form -->
        <form class="subscribe-form">

            <input
                type="email"
                class="email-box"
                placeholder="Your email address..."
                required
            >

            <button type="submit" class="notify-btn">
                Notify Me
            </button>

        </form>


        <!-- Dashboard Illustration -->
        <div class="dashboard-area">

            <div class="dots dots-left"></div>

            <div class="green-block"></div>

            <div class="dashboard">

                <!-- Dashboard Header -->
                <div class="dashboard-header">

                    <div class="circles">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>


                <!-- Sidebar -->
                <div class="sidebar">

                    <div class="small-select"></div>

                    <div class="side-line"></div>
                    <div class="side-line"></div>
                    <div class="side-line"></div>
                    <div class="side-line"></div>
                    <div class="side-line"></div>

                    <div class="black-box">
                        Block
                    </div>

                </div>


                <!-- Dashboard Content -->
                <div class="content">

                    <div class="cards">

                        <!-- Card 1 -->
                        <div class="card">

                            <div class="card-title"></div>
                            <div class="card-text"></div>

                            <span class="blue-dot"></span>

                            <div class="chart">
                                <svg viewBox="0 0 100 30">
                                    <path d="M0 23 C15 16,20 27,32 20 S50 12,60 19 S75 24,87 12 S95 8,100 5"/>
                                </svg>
                            </div>

                        </div>


                        <!-- Card 2 -->
                        <div class="card">

                            <div class="card-title"></div>
                            <div class="card-text"></div>

                            <span class="blue-dot"></span>

                            <div class="chart">
                                <svg viewBox="0 0 100 30">
                                    <path d="M0 20 C12 13,20 26,34 19 S52 15,65 20 S80 23,90 14 S96 8,100 5"/>
                                </svg>
                            </div>

                        </div>


                        <!-- Card 3 -->
                        <div class="card">

                            <div class="card-title"></div>
                            <div class="card-text"></div>

                            <span class="blue-dot"></span>

                            <div class="chart">
                                <svg viewBox="0 0 100 30">
                                    <path d="M0 18 C15 23,25 26,37 18 S53 12,65 20 S82 25,91 15 S97 10,100 4"/>
                                </svg>
                            </div>

                        </div>


                        <!-- Card 4 -->
                        <div class="card">

                            <div class="card-title"></div>
                            <div class="card-text"></div>

                            <span class="blue-dot"></span>

                            <div class="chart">
                                <svg viewBox="0 0 100 30">
                                    <path d="M0 22 C12 16,22 26,35 20 S52 17,64 21 S78 25,89 14 S96 10,100 4"/>
                                </svg>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="dots dots-right"></div>

        </div>


        <!-- Social Icons -->
        <div class="social">

            <a href="#">f</a>
            <a href="#">♥</a>
            <a href="#">●</a>

        </div>


        <!-- Copyright -->
        <p class="copyright">
            © Copyright Ping. All rights reserved.
        </p>

    </main>

</body>
</html>
